---
Name: silvershop-downloads
After:
  - '#silvershop'
  # Run our Product extension after silvershop/stock so we can drop its Stock tab on digital products
  # (a missing reference is ignored, so this is safe when stock isn't installed).
  - '#silvershop-stock'
---
SilverShop\Page\Product:
  extensions:
    - SilverShop\Downloads\ProductDownloadExtension

SilverShop\Model\Variation\Variation:
  extensions:
    - SilverShop\Downloads\VariationDownloadExtension

SilverStripe\Security\Member:
  extensions:
    - SilverShop\Downloads\MemberDownloadsExtension

SilverStripe\SiteConfig\SiteConfig:
  extensions:
    - SilverShop\Downloads\ShopDownloadSettingsExtension

SilverShop\Model\Order:
  extensions:
    - SilverShop\Downloads\DownloadOrderExtension

SilverStripe\Control\Director:
  rules:
    'shop-downloads': SilverShop\Downloads\DownloadController

# Digital goods are commonly file types SilverStripe's default upload whitelist blocks (ebooks, design source,
# lossless audio, fonts). Allow a curated set of safe, non-executable formats so merchants can upload them — these
# files are stored in the protected asset store and only served through the gated controller, never executed.
# Override/extend this list in your project if you need more (or fewer) types.
SilverStripe\Assets\File:
  allowed_extensions:
    - epub
    - mobi
    - azw3
    - ai
    - psd
    - indd
    - eps
    - sketch
    - fig
    - flac
    - aiff
    - wav
    - m4a
    - otf
    - ttf
    - woff
    - woff2
