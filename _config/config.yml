---
Name: silvershop-downloads
After:
  - '#silvershop'
  # Run our Product extension after silvershop/stock so we can drop its Stock tab on digital products
  # (a missing reference is ignored, so this is safe when stock isn't installed).
  - '#silvershop-stock'
---
SilverShop\Page\Product:
  extensions:
    - SilverShop\Downloads\ProductDownloadExtension

SilverStripe\Security\Member:
  extensions:
    - SilverShop\Downloads\MemberDownloadsExtension

SilverStripe\Control\Director:
  rules:
    'shop-downloads': SilverShop\Downloads\DownloadController
